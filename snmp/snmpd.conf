# /etc/snmp/snmpd.conf — Machine 1 (Pare-feu)
# Installation : sudo apt install snmpd snmp -y
# Activation   : sudo systemctl enable --now snmpd

agentAddress udp:161,udp6:[::1]:161

# Communauté en lecture seule, limitée au LAN
# (en production : utiliser SNMPv3 avec authentification + chiffrement)
rocommunity public 10.0.0.0/24

sysLocation    Lab supervision — Mini-reseau VirtualBox
sysContact     admin@lab.local
